; Fallback clip: Adafruit Feather ESP32-S3 + INMP441 mic + SSD1306 OLED + coin vibration motor.
[env:feather]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.12.1
build_flags = -I../common -DBOARD_HAS_PSRAM
build_src_filter = +<*> +<../../common/*.c> +<../../common/*.cpp>
