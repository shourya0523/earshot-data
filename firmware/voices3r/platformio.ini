; M5Stack Atom VoiceS3R (C126, ESP32-S3-PICO-1-N8R8). Based on the m5stack-atoms3 board
; (same S3 module family) with 8 MB octal PSRAM enabled.
[env:voices3r]
platform = espressif32@6.9.0
board = m5stack-atoms3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../common
    -DCONSENT_LIGHT=0          ; 1 = WS2812 on Grove G2 as the consent light
    ; -DAUDIO_RATE_8K          ; reserved: halve bitrate if BLE throughput test fails
build_src_filter = +<*> +<../../common/*.c> +<../../common/*.cpp>
